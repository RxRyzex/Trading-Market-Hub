
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARKET HUB | Mentor Recruitment</title>

<style>
:root {
  --bg:#080b12;
  --panel:#111827;
  --panel2:#151f30;
  --green:#35d399;
  --blue:#42a5ff;
  --text:#f5f8ff;
  --muted:#9ba9bd;
  --border:#25344a;
}

* {box-sizing:border-box}
html {scroll-behavior:smooth}

body {
  margin:0;
  background:
    radial-gradient(ellipse at 10% 10%,#103b3433,transparent 40%),
    radial-gradient(ellipse at 90% 30%,#123d6333,transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button,a {cursor:pointer}
button {font-family:inherit}

header {
  height:76px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:#080b12dd;
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter:blur(12px);
}

.logo {
  font-weight:900;
  font-size:23px;
  letter-spacing:2px;
}

.logo span {color:var(--green)}
.logo em {color:var(--blue);font-style:normal}

.lang {
  background:var(--panel2);
  color:white;
  padding:11px 16px;
  border:1px solid var(--border);
  border-radius:12px;
}

#language {
  min-height:calc(100vh - 76px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.language-card {
  max-width:600px;
  width:100%;
  text-align:center;
  padding:55px 30px;
  border:1px solid var(--border);
  border-radius:25px;
  background:linear-gradient(145deg,#172337,#101722);
  box-shadow:0 20px 70px #0008;
}

.language-card .logo {font-size:32px}

.language-options {
  display:flex;
  gap:15px;
  margin-top:30px;
}

.language-options button {
  flex:1;
  padding:20px;
  background:#172b36;
  color:white;
  border:1px solid var(--border);
  border-radius:14px;
  font-size:17px;
  transition:.2s;
}

.language-options button:hover {
  border-color:var(--green);
  transform:translateY(-3px);
}

.hero {
  max-width:1050px;
  text-align:center;
  margin:100px auto 85px;
  padding:25px;
}

.tag {
  display:inline-block;
  padding:9px 16px;
  border-radius:30px;
  color:var(--green);
  background:#35d39916;
  border:1px solid #35d39944;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
}

h1 {
  font-size:clamp(42px,7vw,76px);
  line-height:1.08;
  margin:25px 0;
}

h1 span {
  background:linear-gradient(90deg,var(--green),var(--blue));
  -webkit-background-clip:text;
  color:transparent;
}

p {
  color:var(--muted);
  line-height:1.8;
}

.hero p {
  max-width:650px;
  margin:20px auto 30px;
  font-size:17px;
}

.hero-art {
  font-size:60px;
  margin:25px 0;
  filter:drop-shadow(0 0 20px #35d39944);
}

.btn {
  display:inline-block;
  padding:16px 24px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
  margin:7px;
  transition:.2s;
}

.btn.primary {
  background:linear-gradient(100deg,var(--green),#61d7e8);
  color:#07130f;
}

.btn.secondary {
  background:var(--panel2);
  color:white;
  border:1px solid var(--border);
}

.btn:hover {transform:translateY(-3px)}

section {
  max-width:1100px;
  margin:90px auto;
  padding:20px;
}

.section-tag {
  text-align:center;
  color:var(--green);
  font-size:12px;
  letter-spacing:3px;
  font-weight:bold;
}

h2 {
  text-align:center;
  font-size:34px;
  margin:12px 0;
}

.section-desc {
  text-align:center;
  max-width:650px;
  margin:0 auto;
}

.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-top:40px;
}

.card {
  background:linear-gradient(145deg,#172337,#101722);
  padding:26px;
  border:1px solid var(--border);
  border-radius:18px;
  transition:.25s;
}

.card:hover {
  transform:translateY(-5px);
  border-color:#35d39988;
}

.card .emoji {
  font-size:35px;
  margin-bottom:12px;
}

.card h3 {color:var(--green)}
.card p {font-size:14px}

.why {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
  margin-top:35px;
}

.why-item {
  padding:22px;
  border-radius:16px;
  background:#121c2a;
  border:1px solid var(--border);
}

.why-item strong {color:var(--blue)}

#application {
  background:linear-gradient(145deg,#131f30,#101722);
  border:1px solid var(--border);
  border-radius:24px;
  padding:35px;
  box-shadow:0 20px 60px #0005;
}

.progress-area {
  max-width:650px;
  margin:35px auto;
}

.progress-labels {
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.progress-labels span {
  font-size:12px;
  color:var(--muted);
  transition:color .3s;
}

.progress-labels .active {
  color:var(--green);
  font-weight:bold;
}

.progress-track {
  height:8px;
  background:#26364a;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  width:33.33%;
  background:linear-gradient(90deg,var(--green),var(--blue));
  border-radius:20px;
  transition:width .55s cubic-bezier(.2,.8,.2,1);
}

form {
  max-width:650px;
  margin:30px auto 0;
  overflow:hidden;
}

/* ANIMATIONS DES PAGES */

.form-step {
  display:none;
  opacity:0;
}

.form-step.active {
  display:block;
  opacity:1;
  animation:slideInRight .45s cubic-bezier(.2,.8,.2,1) forwards;
}

.form-step.leaving-left {
  display:block;
  animation:slideOutLeft .25s ease forwards;
}

.form-step.leaving-right {
  display:block;
  animation:slideOutRight .25s ease forwards;
}

@keyframes slideInRight {
  from {
    opacity:0;
    transform:translateX(45px);
  }
  to {
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes slideOutLeft {
  from {
    opacity:1;
    transform:translateX(0);
  }
  to {
    opacity:0;
    transform:translateX(-35px);
  }
}

@keyframes slideOutRight {
  from {
    opacity:1;
    transform:translateX(0);
  }
  to {
    opacity:0;
    transform:translateX(35px);
  }
}

.step-title {
  font-size:23px;
  margin-bottom:8px;
}

.step-description {
  margin-top:0;
  margin-bottom:25px;
  font-size:14px;
}

.field {margin:19px 0}

label {
  display:block;
  margin-bottom:9px;
  font-size:14px;
  font-weight:bold;
}

input,select,textarea {
  width:100%;
  padding:15px;
  background:#080f1b;
  color:white;
  border:1px solid #34465e;
  border-radius:10px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

input:focus,select:focus,textarea:focus {
  border-color:var(--green);
  box-shadow:0 0 0 3px #35d39918;
}

textarea {
  min-height:120px;
  resize:vertical;
}

select option {background:#111827}

.form-buttons {
  display:flex;
  gap:12px;
  margin-top:30px;
}

.form-buttons button {
  flex:1;
  padding:16px;
  border:0;
  border-radius:11px;
  font-weight:bold;
  font-size:14px;
  transition:transform .2s,opacity .2s;

.form-buttons button:hover {
  transform:translateY(-2px);
}

.next,.submit {
  background:linear-gradient(100deg,var(--green),#61d7e8);

}

.previous {
  background:#26364a;
  color:white;
}

.note {
  font-size:12px;
  text-align:center;
  margin-top:20px;
}

#formMessage {
  text-align:center;
  margin-top:20px;
  font-weight:bold;

footer {
  text-align:center;
  padding:40px 20px;
  border-top:1px solid var(--border);
  color:var(--muted);
}

footer a {color:var(--green)}

@media(max-width:600px) {
  header {padding:0 5%}
  .hero {margin:65px auto}
  .language-options {flex-direction:column}
  #application {padding:22px 16px}
  .form-buttons {flex-direction:column}
  .progress-labels span {font-size:10px}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior:auto !important;
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<script>
let currentLanguage = 'fr';
let currentStep = 0;
let isAnimating = false;

const steps = document.querySelectorAll('.form-step');
const progressFill = document.getElementById('progressFill');
const progressLabels = document.querySelectorAll('.progress-labels span');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const submitBtn = document.getElementById('submitBtn');

function setLanguage(lang) {
  currentLanguage = lang;
  document.documentElement.lang = lang;
  document.getElementById('language').hidden = true;
  document.getElementById('home').hidden = false;

  document.querySelectorAll('[data-fr]').forEach(el => {
    el.innerHTML = el.dataset[lang];
  });

  document.querySelectorAll('option[data-fr]').forEach(el => {
    el.textContent = el.dataset[lang];
  });

  updateStepControls();
}

function showLanguage() {
  document.getElementById('home').hidden = true;
  document.getElementById('language').hidden = false;
}

function validateCurrentStep() {
  const fields = steps[currentStep].querySelectorAll('input, select, textarea');

  for (const field of fields) {
    if (!field.checkValidity()) {
      field.reportValidity();
      return false;
    }
  }

  return true;
}

function updateStepControls() {
  progressFill.style.width =
    ((currentStep + 1) / steps.length * 100) + '%';

  progressLabels.forEach((label, index) => {
    label.classList.toggle('active', index === currentStep);
  });

  prevBtn.hidden = currentStep === 0;
  nextBtn.hidden = currentStep === steps.length - 1;
  submitBtn.hidden = currentStep !== steps.length - 1;
}

function changeStep(direction) {
  if (isAnimating) return;

  if (direction === 1 && !validateCurrentStep()) return;

  const newStep = currentStep + direction;

  if (newStep < 0 || newStep >= steps.length) return;

  isAnimating = true;

  const oldElement = steps[currentStep];
  const newElement = steps[newStep];

  oldElement.classList.remove('active');
  oldElement.classList.add(
    direction === 1 ? 'leaving-left' : 'leaving-right'
  );

  newElement.classList.add('active');

  currentStep = newStep;

  updateStepControls();

  document.getElementById('formMessage').textContent = '';

  setTimeout(() => {
    oldElement.classList.remove('leaving-left', 'leaving-right');
    isAnimating = false;
  }, 460);
}

nextBtn.addEventListener('click', () => changeStep(1));
prevBtn.addEventListener('click', () => changeStep(-1));

document.getElementById('mentorForm').addEventListener('submit', function(e) {
  e.preventDefault();

  if (isAnimating || !validateCurrentStep()) return;

  document.getElementById('formMessage').textContent =
    currentLanguage === 'fr'
    ? "Le formulaire est prêt, mais l'envoi doit encore être connecté au serveur Discord."
    : "The form is ready, but submission still needs to be connected to the Discord server.";

  document.getElementById('formMessage').style.color = 'var(--green)';
});

updateStepControls();
</script>

</body>
</html>
